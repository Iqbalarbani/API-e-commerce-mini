name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  lint-and-test:
    name: Lint & Test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: minishop
          POSTGRES_PASSWORD: minishop_secret
          POSTGRES_DB: minishop_test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U minishop -d minishop_test_db"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql+psycopg://minishop:minishop_secret@localhost:5432/minishop_test_db
      TEST_DATABASE_URL: postgresql+psycopg://minishop:minishop_secret@localhost:5432/minishop_test_db
      JWT_SECRET_KEY: ci-test-secret-key

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint with ruff
        run: ruff check .

      - name: Run tests with coverage
        run: pytest --cov=app --cov-report=term-missing --cov-fail-under=80

  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: lint-and-test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t mini-shop-api:ci .
